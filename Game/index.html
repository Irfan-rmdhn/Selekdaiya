<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="screen welcome">
        <header class="head-welcome">
            <h1>Welcome to Head ball game</h1>
            <form action="" class="form-game">
                <input type="text" name="usn" placeholder="input username" class="username">
                <select name="level" id="level">
                    <option value="easy">easy</option>
                    <option value="medium">medium</option>
                    <option value="hard">hard</option>
                </select>
                <div class="balls">
                    <img src="GAME_MEDIA/Sprites/Ball 01.png" class="ball-pick" data-ball="Ball 01" alt="">
                    <img src="GAME_MEDIA/Sprites/Ball 02.png" data-ball="Ball 02" alt="">
                </div>
                <div class="bendera">
                    <select required name="myflag" id="my-flag">
                        <option value="" disabled selected>Pilih Bendera Anda</option>
                        <option value="Brazil">Brazil</option>
                        <option value="England">England</option>
                        <option value="Germany">Germany</option>
                        <option value="Italy">Italy</option>
                        <option value="Japan">Japan</option>
                        <option value="Netherlands">Netherlands</option>
                        <option value="Portugal">Portugal</option>
                        <option value="Spain">Spain</option>
                    </select>
                    <select required name="enemyflag" id="enemy-flag">
                        <option value="" disabled selected>Pilih Bendera Lawan</option>
                        <option value="Brazil">Brazil</option>
                        <option value="England">England</option>
                        <option value="Germany">Germany</option>
                        <option value="Italy">Italy</option>
                        <option value="Japan">Japan</option>
                        <option value="Netherlands">Netherlands</option>
                        <option value="Portugal">Portugal</option>
                        <option value="Spain">Spain</option>
                    </select>
                    <button id="random-enemy">Random</button>
                </div>


                <div class="btn">
                    <button class="play" type="submit">Play Game</button>
                    <button class="instruction" type="button">Instruction</button>
                </div>
            </form>
        </header>
        <div class="ins">
            <h1>How To Play Game <span
                    style="position: relative; left: 20%;font-family: Verdana, Geneva, Tahoma, sans-serif;color: red;cursor: pointer;">X</span>
            </h1>
            <ul>
                <li>Input Username</li>
                <li>Select Level,Ball,And Country </li>
                <li>Press Play Game To Start</li>
                <li>Enjoy The Game</li>
            </ul>
        </div>
    </div>
    <div class="screen count">3</div>
    <div class="screen main">
        <h1 id="username">RaditKun</h1>
        <div class="tengah">
            <div class="anu">
                <div class="my-flag-game">
                    <img src="GAME_MEDIA/Sprites/Flag/Brazil.png" width="50%" alt="">
                    <strong>Brazil</strong>
                </div>
                <div class="score">
                    <h1>2</h1>
                    <hr style="height: 100%;background-color: black">
                    <h1>0</h1>
                </div>
                <div class="enemy-flag-game">  
                    <img src="GAME_MEDIA/Sprites/Flag/Brazil.png" width="50%" alt="">
                    <strong>Brazil</strong>
                </div>
            </div>
            <div class="timer">
                <h2>Timer</h2>
                <strong>30</strong>
            </div>
        </div>
        <h1>History</h1>
        <div class="flag-game">
            <img src="GAME_MEDIA/Sprites/Flag/Brazil.png" id="flagMy" alt="">
            <img src="GAME_MEDIA/Sprites/Flag/Japan.png" id="flagEnemy" alt="">
            <img src="GAME_MEDIA/Sprites/Flag/Brazil.png" id="flagMy" alt="">
            <img src="GAME_MEDIA/Sprites/Flag/Japan.png" id="flagEnemy" alt="">
            <img src="GAME_MEDIA/Sprites/Flag/Brazil.png" id="flagMy" alt="">
            <img src="GAME_MEDIA/Sprites/Flag/Japan.png" id="flagEnemy" alt="">
            <img src="GAME_MEDIA/Sprites/Flag/Brazil.png" id="flagMy" alt="">
            <img src="GAME_MEDIA/Sprites/Flag/Japan.png" id="flagEnemy" alt="">
            <img src="GAME_MEDIA/Sprites/Flag/Brazil.png" id="flagMy" alt="">
            <img src="GAME_MEDIA/Sprites/Flag/Japan.png" id="flagEnemy" alt="">
            <img src="GAME_MEDIA/Sprites/Flag/Brazil.png" id="flagMy" alt="">
            <img src="GAME_MEDIA/Sprites/Flag/Japan.png" id="flagEnemy" alt="">
        </div>
        <div class="game-main">

        </div>
    </div>
    
    <script src="Screen/Gameboard.js"></script>
    <script src="Screen/welcome.js"></script>
    <script src="Screen/count.js"></script>
    <script src="/Screen/Object/Char.js"></script>
    <script src="/Screen/Object/Ball.js"></script>
    <script src="/Screen/Object/Item.js"></script>
    <script src="Screen.js"></script>
</body>

</html>
